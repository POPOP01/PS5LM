name: build-eboot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout PS5LM with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: PS5LM

      - name: Host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev \
            cmake ninja-build meson socat unzip wget rsync pkg-config flex bison \
            glslang-tools imagemagick librsvg2-bin ffmpeg \
            python3-mako python3-ply libvulkan-dev spirv-headers \
            zlib1g-dev patchelf
          pip3 install --break-system-packages -U meson ninja
          meson --version
          # noble ships ImageMagick 6 (convert only, no IM7 `magick`), and
          # build-app.sh calls `magick in.svg out.png`; shim it onto
          # rsvg-convert, which also renders the SVG's gradients correctly
          printf '#!/bin/sh\ncase $# in 2) exec rsvg-convert -o "$2" "$1" ;; *) exec convert "$@" ;; esac\n' \
            | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
          echo "LLVM_CONFIG=$(command -v llvm-config-18)" >> "$GITHUB_ENV"

      - name: glslc provider
        run: |
          if ! command -v glslc >/dev/null; then
            git clone --depth 1 https://github.com/google/shaderc "$RUNNER_TEMP/shaderc"
            cd "$RUNNER_TEMP/shaderc"
            ./utils/git-sync-deps
            mkdir build && cd build
            cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release \
              -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON \
              -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
            ninja
            p=$(find . -maxdepth 3 -type f -name glslc | head -1)
            if [ -n "$p" ]; then
              sudo install -m755 "$p" /usr/local/bin/glslc
            else
              echo "glslc executable not found, tree:"
              find . -maxdepth 3 | head -50
              exit 1
            fi
          fi
          glslc --version | head -1

      - name: SPIRV-Tools from source
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools "$RUNNER_TEMP/spirv-tools"
          cd "$RUNNER_TEMP/spirv-tools"
          python3 utils/git-sync-deps
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build build
          sudo cmake --install build --prefix /usr/local
          sudo ldconfig
          pkg-config --modversion SPIRV-Tools

      - name: Layout PS5_Vulkan forks
        run: |
          cd PS5LM
          # replica mode: check out the pristine v0.8.3 tree so the built
          # binary can be compared byte-for-byte against the official release
          git checkout --detach v0.8.3
          git submodule update --init --recursive
          mkdir -p .deps/src .deps/ps5-opengl
          git clone https://github.com/mihawk-99/PS5_Vulkan .deps/src/PS5_Vulkan
          git clone https://github.com/mihawk-99/PS5_Mesa .deps/src/PS5_Mesa
          git clone https://github.com/mihawk-99/PS5_PayloadSDK .deps/src/PS5_PayloadSDK
          # rebuild the exact v0.8.3 input combination: the console rejects
          # the f410e67 head with a no-log instant crash, and that one commit
          # also carries the known make-app ps5_fp_ieee link regression
          git -C .deps/src/PS5_Vulkan checkout --detach 252bf912a745e3566a93b69b098bdc8ec4048837
          git -C .deps/src/PS5_PayloadSDK checkout --detach b5efad528e0ac1b8289f39d72a0e890ff68ff0a6
          wget -q https://github.com/blackbearreloaded/ps5-opengl/releases/download/v1.0.0/ps5-opengl-sdk-1.0.0.tar.gz
          tar xf ps5-opengl-sdk-1.0.0.tar.gz -C .deps/ps5-opengl/
          test -f .deps/ps5-opengl/ps5-opengl-sdk-1.0.0/sdk/lib/libPS5OpenGL.a

      - name: Patch converter to omit providerless weak imports
        run: |
          cd PS5LM/.deps/src/PS5_Vulkan
          python3 - <<'EOF'
          p = 'tooling/native/sce_module_writer.cpp'
          s = open(p, encoding='utf-8').read()
          old = '        require(provider != nullptr, "no public SDK stub exports required symbol " + symbol.name);'
          new = ('        if (provider == nullptr && symbol.weak() && symbol.undefined())\n'
                 '            continue;  /* optional entry point: weak import with no provider, SELF omits it */\n'
                 + old)
          assert old in s, 'anchor line not found'
          open(p, 'w', encoding='utf-8', newline='\n').write(s.replace(old, new, 1))
          print('patched', p)
          EOF

      - name: Build RADV and runtime
        run: |
          cd PS5LM/.deps/src/PS5_Vulkan
          chmod +x tools/*.sh tools/*.py Makefile
          # align with the Mesa the v0.8.3 title was actually built from:
          # 1ba9874 (Oct 12) landed the same day as the release and its entry
          # points go weak, which the title converter refuses
          export PS5_MESA_REVISION=47e9eb61ee7e1112194557e1e047178562827bc6
          tools/setup-native-dependencies.sh
          tools/build-radv.sh release
          # upstream main's hello-world link regressed (ps5_fp_ieee has no
          # provider on the build.sh link line); everything we need from
          # make app is built before that final link
          make app || true
          test -f .deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          test -f runtime/libc.prx
          test -f build/host/ps5-native-tool
          nm=.deps/native/ps5-payload-sdk/bin/llvm-nm
          ls -l .deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          "$nm" --defined-only .deps/native/radv-release/lib/libvulkan_radeon.ps5.a 2>/dev/null | grep -c "T radv_EnumeratePhysicalDevices" || echo "RADV archive lacks radv_EnumeratePhysicalDevices"
          "$nm" --defined-only .deps/native/radv-release/lib/libvulkan_radeon.ps5.a 2>/dev/null | grep -c " T radv_" || true

      - name: Build app
        run: |
          cd PS5LM
          mkdir -p build
          chmod +x scripts/*.sh ps5/app/ps5cc ps5/app/ps5cxx
          scripts/setup-sdk.sh
          scripts/build-mbedtls.sh
          bash -x scripts/build-app.sh || {
            nm=.deps/src/PS5_Vulkan/.deps/native/ps5-payload-sdk/bin/llvm-nm
            if [ -f build/app-ps5/llvm-pie.elf ]; then
              "$nm" -D build/app-ps5/llvm-pie.elf | grep -i "radv_Enum\|radv_" | head -30 > build/dynsym-radv.txt || true
              "$nm" build/app-ps5/llvm-pie.elf 2>/dev/null | grep "radv_EnumeratePhysicalDevices" | head -10 >> build/dynsym-radv.txt || true
            fi
            exit 1
          }
          test -f build/app-ps5/title/PPSA99581/eboot.bin

      - name: Upload link debug evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: link-debug
          path: |
            PS5LM/build/dynsym-radv.txt
            PS5LM/build/app-ps5.configure.log
          if-no-files-found: ignore

      - name: Upload title artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99581-title
          path: PS5LM/build/app-ps5/title/PPSA99581/
          if-no-files-found: error

      - name: Host strtof vectors
        run: |
          cd PS5LM/ps5/compat
          # replica builds check out the pristine tag, which has no port yet
          if [ -f float_strtod.c ]; then
            clang test_strtof.c float_strtod.c -o test_strtof_host -lm
            ./test_strtof_host
          else
            echo "replica tree: float port not present, vectors skipped"
          fi
